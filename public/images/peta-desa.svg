<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Ilustrasi peta lokasi Desa Ngadimulyo, Kecamatan Kedu, Kabupaten Temanggung</title>
  <desc id="mapDesc">Ilustrasi kartografis: jalan desa, sawah, kebun kopi, balai pertemuan, dan Gunung Sumbing di utara.</desc>
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f7e7"/>
      <stop offset="1" stop-color="#e4efd3"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ba24e"/>
      <stop offset="1" stop-color="#4a6d24"/>
    </linearGradient>
    <pattern id="padi" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8h16M8 0v16" stroke="#a3c37c" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <pattern id="kebun" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.2" fill="#5d8432" opacity="0.5"/>
      <circle cx="16" cy="14" r="2.2" fill="#38571a" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1400" height="600" fill="url(#land)"/>

  <!-- mountains -->
  <path d="M0 210 L230 60 L420 200 L610 40 L830 215 L1010 90 L1230 205 L1400 120 L1400 0 L0 0 Z" fill="url(#mtn)" opacity="0.9"/>
  <path d="M610 40 L560 120 L660 120 Z" fill="#38571a" opacity="0.35"/>
  <path d="M230 60 L190 130 L280 130 Z" fill="#38571a" opacity="0.3"/>
  <text x="640" y="30" font-family="Georgia, serif" font-size="15" fill="#f1f7e7" opacity="0.9" letter-spacing="4">GUNUNG SUMBING</text>

  <!-- rice fields -->
  <g opacity="0.9">
    <rect x="90" y="300" width="360" height="170" rx="8" fill="url(#padi)" stroke="#a3c37c"/>
    <text x="110" y="326" font-family="sans-serif" font-size="13" fill="#4a6d24" letter-spacing="2">SAWAH DESA</text>
    <rect x="960" y="330" width="320" height="150" rx="8" fill="url(#padi)" stroke="#a3c37c"/>
    <text x="982" y="356" font-family="sans-serif" font-size="13" fill="#4a6d24" letter-spacing="2">SAWAH NGADIMULYO</text>
  </g>

  <!-- coffee gardens -->
  <g>
    <rect x="520" y="270" width="330" height="220" rx="10" fill="url(#kebun)" stroke="#5d8432" stroke-dasharray="6 5"/>
    <text x="542" y="298" font-family="sans-serif" font-size="13" fill="#24380f" letter-spacing="2">KEBUN KOPI ANGGOTA</text>
    <rect x="150" y="510" width="260" height="70" rx="8" fill="url(#kebun)" stroke="#5d8432" stroke-dasharray="6 5"/>
  </g>

  <!-- river -->
  <path d="M-20 470 C 260 440 380 520 620 500 S 1080 440 1420 490" fill="none" stroke="#c8ddeb" stroke-width="16" stroke-linecap="round"/>
  <path d="M-20 470 C 260 440 380 520 620 500 S 1080 440 1420 490" fill="none" stroke="#8fb8d4" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1188" y="452" font-family="sans-serif" font-size="12" fill="#1d5f8a" font-style="italic">Kali Ngadimulyo</text>

  <!-- roads -->
  <path d="M0 340 H1400" stroke="#ebe2cf" stroke-width="26"/>
  <path d="M0 340 H1400" stroke="#c9b98f" stroke-width="2" stroke-dasharray="12 10"/>
  <path d="M470 210 V600" stroke="#ebe2cf" stroke-width="18"/>
  <path d="M1090 240 V600" stroke="#ebe2cf" stroke-width="14"/>

  <!-- balai pertemuan marker -->
  <g transform="translate(470 340)">
    <circle r="34" fill="#38571a" opacity="0.15"/>
    <circle r="18" fill="#38571a" stroke="#f1f7e7" stroke-width="4"/>
    <circle r="6" fill="#d58400"/>
    <line x1="-18" y1="-18" x2="-62" y2="-50" stroke="#1b2b0c" stroke-width="2"/>
    <rect x="-332" y="-84" width="272" height="48" rx="9" fill="#1b2b0c" opacity="0.94"/>
    <text x="-316" y="-64" font-family="sans-serif" font-size="14" font-weight="700" fill="#f1f7e7">BALAI PERTEMUAN</text>
    <text x="-316" y="-48" font-family="sans-serif" font-size="11.5" fill="#c9deac">KWT Srikandi Buana · Kantor sekretariat</text>
  </g>

  <!-- rumah jemur marker -->
  <g transform="translate(700 415)">
    <circle r="12" fill="#d58400" stroke="#fff" stroke-width="3"/>
    <rect x="20" y="-14" width="168" height="28" rx="7" fill="#fffaf0" stroke="#eed9a6"/>
    <text x="30" y="5" font-family="sans-serif" font-size="12" fill="#a16200">Rumah jemur kopi</text>
  </g>

  <g transform="translate(1230 250)">
    <rect x="0" y="0" width="150" height="30" rx="7" fill="#fffaf0" stroke="#e6e2d2"/>
    <text x="12" y="20" font-family="sans-serif" font-size="11.5" fill="#6a6f61">7.2°S · 110.1°E</text>
  </g>

  <!-- compass -->
  <g transform="translate(1310 520)">
    <circle r="30" fill="#fffaf0" stroke="#dfdfd6"/>
    <path d="M0 -18 L7 8 L0 3 L-7 8 Z" fill="#38571a"/>
    <text x="-6" y="-24" font-family="sans-serif" font-size="11" font-weight="700" fill="#38571a">U</text>
  </g>

  <!-- scale -->
  <g transform="translate(70 560)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#3c4233" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#3c4233" stroke-width="2"/>
    <line x1="70" y1="-4" x2="70" y2="4" stroke="#3c4233" stroke-width="2"/>
    <line x1="140" y1="-5" x2="140" y2="5" stroke="#3c4233" stroke-width="2"/>
    <text x="0" y="20" font-family="sans-serif" font-size="11" fill="#6a6f61">0</text>
    <text x="128" y="20" font-family="sans-serif" font-size="11" fill="#6a6f61">500 m</text>
  </g>

  <text x="1350" y="578" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#8b9081">Ilustrasi kartografis — bukan peta survei</text>
</svg>
