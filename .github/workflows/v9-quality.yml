name: V9.2 quality gate

on:
  push:
    branches:
      - v9-rebuild
      - feat/v9-operational-core
      - feat/v9.2-production-integration
      - feat/v9.2-profile-content-studio
      - feat/issue-90-tenant-rls-qa-20261128
  pull_request:
    branches:
      - v9-rebuild
      - feat/v9-operational-core
      - feat/v9.2-production-integration
      - feat/v9.2-profile-content-studio
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tenant-rls-postgres16:
    name: Tenant RLS PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srikandi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srikandi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Apply V9 migrations and run PostgreSQL 16 RLS integration
        run: bash scripts/run-tenant-rls-postgres16.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/srikandi

  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Organization reporting regression checks
        run: npm run test:organization-reporting

      - name: Core workspace shell contract checks
        run: npm run test:core-shell-contract

      - name: TypeScript validation
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
