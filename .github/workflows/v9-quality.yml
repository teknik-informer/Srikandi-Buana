name: V9.1 quality gate

on:
  push:
    branches:
      - v9-rebuild
      - feat/v9-operational-core
      - feat/v9.2-production-integration
  pull_request:
    branches:
      - v9-rebuild
      - feat/v9-operational-core
      - feat/v9.2-production-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Organization reporting regression checks
        run: npm run test:organization-reporting

      - name: TypeScript validation
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
