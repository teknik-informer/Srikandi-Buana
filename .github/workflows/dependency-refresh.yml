name: Controlled dependency lockfile refresh
on:
  push:
    branches:
      - feat/enterprise-v12-foundation
    paths:
      - .github/refresh-dependency-lockfile
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ contains(github.event.head_commit.message, '[refresh-lockfile]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: npm
      - name: Regenerate the lockfile from reviewed package versions
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install the exact locked dependency tree
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full dependency audit (report-only during upstream remediation)
        run: npm audit --audit-level=moderate || true
      - name: Navigation and terminology tests
        run: npm run test:navigation:compat && npm run test:terminology
      - name: Enterprise architecture regression tests
        run: npm run test:ecosystem
      - name: Integration security tests
        run: npm run test:integration:staging
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Project regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit the verified lockfile
        run: |
          rm .github/refresh-dependency-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/refresh-dependency-lockfile
          git commit -m "chore(deps): refresh verified lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
