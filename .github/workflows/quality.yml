name: Pemeriksaan Mutu Srikandi Buana
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=low
      - name: Full dependency audit report
        run: npm audit --audit-level=moderate || true
      - name: Navigation and terminology tests
        run: npm run test:navigation:compat && npm run test:terminology
      - name: Integration security tests
        run: npm run test:integration:staging
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Project regression tests
        run: npm test
      - name: Build
        run: npm run build
