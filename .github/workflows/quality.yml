name: Pemeriksaan Mutu Srikandi Buana
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  refresh-lockfile:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message || '', '[refresh-lockfile]') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact locked dependencies
        run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=low
      - name: Full dependency security gate
        run: npm audit --audit-level=moderate
      - name: Navigation and terminology tests
        run: npm run test:navigation:compat && npm run test:terminology
      - name: Integration security tests
        run: npm run test:integration:staging
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Project regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Sync latest branch head before committing
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase --autostash "origin/${GITHUB_REF_NAME}"
      - name: Commit verified lockfile
        run: |
          rm .github/refresh-security-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/refresh-security-lockfile
          git commit -m "chore(security): pin patched minimatch in eslint toolchain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=low
      - name: Full dependency audit report
        run: npm audit --audit-level=moderate
      - name: Navigation and terminology tests
        run: npm run test:navigation:compat && npm run test:terminology
      - name: Integration security tests
        run: npm run test:integration:staging
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Project regression tests
        run: npm test
      - name: Build
        run: npm run build
