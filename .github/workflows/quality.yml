name: Pemeriksaan Mutu Srikandi Buana
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: srikandi_cas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srikandi_cas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Atomic CAS PostgreSQL integration tests
        run: npm run test:record-cas-postgres
        env:
          PG_INTEGRATION_URL: postgresql://postgres:postgres@localhost:5432/srikandi_cas_test
      - name: Atomic CAS application-domain PostgreSQL integration tests
        run: npm run test:record-cas-postgres-domain
        env:
          PG_INTEGRATION_URL: postgresql://postgres:postgres@localhost:5432/srikandi_cas_test
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=low
      - name: Full dependency security gate
        run: npm audit --audit-level=moderate
      - name: Navigation and terminology tests
        run: npm run test:navigation:compat && npm run test:terminology
      - name: Enterprise architecture regression tests
        run: npm run test:ecosystem
      - name: External access security tests
        run: npm run test:external-access
      - name: Agriculture domain and privacy tests
        run: npm run test:agriculture
      - name: Integration security tests
        run: npm run test:integration:staging
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Project regression tests
        run: npm test
      - name: Build
        run: npm run build
