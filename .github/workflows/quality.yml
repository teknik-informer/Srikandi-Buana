name: Pemeriksaan Mutu Srikandi Buana
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=low
      - name: Full dependency security gate
        run: npm audit --audit-level=moderate
      - name: Navigation and terminology tests
        run: npm run test:navigation:compat && npm run test:terminology
      - name: Enterprise architecture regression tests
        run: npm run test:ecosystem
      - name: External access security tests
        run: npm run test:external-access
      - name: Agriculture domain and privacy tests
        run: npm run test:agriculture
      - name: Integration security tests
        run: npm run test:integration:staging
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Project regression tests
        run: npm test
      - name: Build
        run: npm run build
